name: 生成 3D 贡献日历

on:
  schedule:
    - cron: '29 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 渲染 3D 贡献日历
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: 提交生成的图片
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo '3D chart unchanged.'
          else
            git commit -m 'chore(profile): refresh 3D contributions [skip ci]'
            git push
          fi
